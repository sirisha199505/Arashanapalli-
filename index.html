<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arashanapalli Traders, Secunderabad — door hardware, furniture fittings and interior products since 1970. Get brand-wise quotes instantly." />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
